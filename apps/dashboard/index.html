<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit e user-scalable: a tela é usada em pé, no corredor, com uma mão. Um
         zoom acidental no meio da triagem custa o segundo toque. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#101418" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- No iPhone o Web Push só existe para o app adicionado à tela de início (iOS 16.4+),
         e é este par que o faz abrir como app, e não como aba do Safari. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="lince" />
    <title>lince — triagem</title>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
