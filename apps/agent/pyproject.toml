[project]
name = "lince-agent"
version = "0.0.0"
description = "Agente da borda — ingestão RTSP, detecção, tracking, regras e clipe"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    # Fila local durável do §3.6 (ADR-004). Em Python 3.12 não puxa dependência
    # transitiva nenhuma, o que mantém a imagem do box enxuta.
    "redis>=5.0",
    # Inferência do §3.2 (ADR-009). MIT, e o modelo é um arquivo `.onnx` avulso — que
    # é exatamente o que o `GET /v1/models/current` do §5.2 distribui com checksum.
    # Um framework de treino traria gigabytes que só servem para treinar.
    "onnxruntime>=1.20",
    # Só por `linear_sum_assignment`, a atribuição ótima do §3.3. Parece exagero para
    # uma função, e não é: um solver de atribuição escrito à mão é código crítico a mais
    # para uma pessoa só manter (R-11), e um erro sutil nele **é** o R-2.
    "scipy>=1.14",
]

[project.scripts]
lince-agent = "lince_agent.__main__:main"

[dependency-groups]
dev = [
    # Só de desenvolvimento: o agente monta dicionários puros e o schema do §5 é
    # verificado no teste. Validar em runtime custaria dependência no box para
    # conferir um formato que o próprio agente acabou de produzir.
    "jsonschema>=4.23",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lince_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Testes que precisam de infraestrutura ficam de fora por padrão. O resto tem que
# rodar com `uv run pytest` numa máquina limpa:
#   pnpm rtsp:up  && uv run pytest -m rtsp
#   pnpm infra:up && uv run pytest -m redis
#   bash scripts/modelo.sh && uv run pytest -m modelo
addopts = "-m 'not rtsp and not redis and not modelo'"
markers = [
    "rtsp: exige um servidor RTSP em RTSP_TEST_URL (ver infra/docker-compose.rtsp.yml)",
    "redis: exige um Redis em LINCE_REDIS_URL (ver infra/docker-compose.yml)",
    "modelo: exige o .onnx em LINCE_MODEL_PATH (ver scripts/modelo.sh)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
