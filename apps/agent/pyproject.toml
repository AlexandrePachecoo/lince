[project]
name = "lince-agent"
version = "0.0.0"
description = "Agente da borda — ingestão RTSP, detecção, tracking, regras e clipe"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    # Fila local durável do §3.6 (ADR-004). Em Python 3.12 não puxa dependência
    # transitiva nenhuma, o que mantém a imagem do box enxuta.
    "redis>=5.0",
    # O ONNX Runtime (ADR-009) NÃO está aqui: ele mora nos grupos `cpu` e `gpu` abaixo,
    # porque `onnxruntime` e `onnxruntime-gpu` instalam o mesmo módulo e não convivem.
    # Só por `linear_sum_assignment`, a atribuição ótima do §3.3. Parece exagero para
    # uma função, e não é: um solver de atribuição escrito à mão é código crítico a mais
    # para uma pessoa só manter (R-11), e um erro sutil nele **é** o R-2.
    "scipy>=1.14",
]

[project.scripts]
lince-agent = "lince_agent.__main__:main"

[dependency-groups]
# Inferência do §3.2 (ADR-009). MIT, e o modelo é um arquivo `.onnx` avulso — que é
# exatamente o que o `GET /v1/models/current` do §5.2 distribui com checksum. Um
# framework de treino traria gigabytes que só servem para treinar.
#
# Dois grupos, um de cada vez (`conflicts` abaixo). `cpu` é o padrão: Codespace, CI e
# qualquer máquina sem placa. `gpu` é o do box da loja (apps/agent/Dockerfile) e o da
# máquina de desenvolvimento com placa:
#
#   uv sync --no-group cpu --group gpu
#
# Com os dois no mesmo ambiente, o segundo a instalar sobrescreve os arquivos do
# primeiro, e o que sobra é um pacote meio CPU, meio GPU que importa sem erro.
cpu = ["onnxruntime>=1.20"]
# O piso não é enfeite: a partir da 1.27 o `onnxruntime-gpu` do PyPI é compilado contra
# CUDA 13 e cuDNN 9, que é o que a imagem base do Dockerfile traz. Subir este pacote
# para uma versão compilada contra outro CUDA não dá erro na instalação — o provider de
# CUDA falha ao carregar e a sessão roda em CPU (§10.10). É o job `imagem` do CI que
# pega isso, conferindo com `ldd` que as bibliotecas do provider resolvem na imagem.
gpu = ["onnxruntime-gpu>=1.27"]
dev = [
    # Só de desenvolvimento: o agente monta dicionários puros e o schema do §5 é
    # verificado no teste. Validar em runtime custaria dependência no box para
    # conferir um formato que o próprio agente acabou de produzir.
    "jsonschema>=4.23",
    "pytest>=8.3",
    # Só para tests/test_box.py ler o compose do box (§3.8) como dado, e não por regex.
    "pyyaml>=6.0",
    "ruff>=0.8",
    # Só para a suíte montar um RTMPose mínimo com `onnx.helper`. Não é runtime:
    # o box continua falando só com o ONNX Runtime, e torch/mmpose/rtmlib não entram.
    "onnx>=1.16",
]

[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lince_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Testes que precisam de infraestrutura ficam de fora por padrão. O resto tem que
# rodar com `uv run pytest` numa máquina limpa:
#   pnpm rtsp:up  && uv run pytest -m rtsp
#   pnpm infra:up && uv run pytest -m redis
#   bash scripts/modelo.sh && uv run pytest -m modelo
addopts = "-m 'not rtsp and not redis and not modelo'"
markers = [
    "rtsp: exige um servidor RTSP em RTSP_TEST_URL (ver infra/docker-compose.rtsp.yml)",
    "redis: exige um Redis em LINCE_REDIS_URL (ver infra/docker-compose.yml)",
    "modelo: exige o .onnx em LINCE_MODEL_PATH (ver scripts/modelo.sh)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
