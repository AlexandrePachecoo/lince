# Infraestrutura de DESENVOLVIMENTO do control plane (nuvem).
#
# Este arquivo NÃO é o compose do box da loja. O box (agente + redis local +
# tailscale + watchtower, §3.8 da arquitetura) mora em arquivo próprio e sobe
# em hardware com GPU — misturar os dois confunde dois ambientes que têm
# requisitos e ciclos de vida diferentes.
#
# Uso:  pnpm infra:up   (ou  docker compose -f infra/docker-compose.yml up -d)
#
# O Redis daqui também é o alvo dos testes marcados com `redis` do agente
# (`uv run pytest -m redis`), que usam o banco 15 e prefixo próprio por teste. Não é
# o Redis do box — é o mesmo software cumprindo dois papéis em desenvolvimento.
#
# O RustFS faz o papel do Cloudflare R2 (§4.4) em desenvolvimento: é a mesma API S3,
# então a URL pré-assinada que a API emite e o `PUT` que o agente faz nela são o
# mesmo código dos dois lados — o que muda é só o endpoint. Vale a pena rodar um
# container a mais por isso: o caminho do clipe é onde moram as armadilhas já pagas
# do agente (`Content-Length` obrigatório, corpo reaberto a cada tentativa), e
# nenhuma delas aparece se o teste só conferir o formato da URL assinada.

name: lince-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: lince-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lince}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-lince}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lince} -d ${POSTGRES_DB:-lince}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: lince-redis
    restart: unless-stopped
    # appendonly: BullMQ perde jobs enfileirados se o Redis reiniciar sem AOF.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Papel do Cloudflare R2 (§4.4) em desenvolvimento. Path-style (`/bucket/chave`) é
  # o que o RustFS fala sem `RUSTFS_SERVER_DOMAINS` e o que o R2 também aceita, então o
  # mesmo assinador serve aos dois sem um caso especial por ambiente.
  #
  # Até 2026-09 isto era `minio/minio:latest`. A MinIO tirou `minio/minio` e `minio/mc`
  # do Docker Hub e fechou o pull anônimo no quay.io, e o CI passou a cair aqui antes do
  # primeiro teste. RustFS é Apache-2.0, publica release no Docker Hub e fala a mesma
  # API S3 com o mesmo desenho de portas (9000 S3, 9001 console). A versão é fixa pelo
  # mesmo motivo do box (§3.8): `latest` foi o que quebrou o CI sem commit nenhum.
  s3:
    image: rustfs/rustfs:1.0.4
    container_name: lince-s3
    restart: unless-stopped
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_ACCESS_KEY: ${S3_ROOT_USER:-lince}
      RUSTFS_SECRET_KEY: ${S3_ROOT_PASSWORD:?defina S3_ROOT_PASSWORD em infra/.env}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Cria os buckets e sai. Sem isto, a primeira emissão de URL pré-assinada assina
  # perfeitamente contra um bucket que não existe e o `PUT` do agente leva 404 — um
  # erro que se parece com bug de assinatura e não é.
  #
  # Dois buckets pelo mesmo motivo do schema `lince_test` do Postgres: a suíte da API
  # apaga o que cria, e apagar por engano os clipes que o dev estava olhando na mão
  # seria um jeito bobo de perder uma tarde.
  #
  # O cliente é a AWS CLI oficial, e não o cliente de um servidor específico: ela fala
  # S3 com qualquer um, então a próxima troca de servidor não arrasta esta etapa junto.
  # `head-bucket || mb` faz o papel do `--ignore-existing` que o `aws s3 mb` não tem —
  # sem ele, o segundo `pnpm infra:up` falharia com BucketAlreadyOwnedByYou.
  s3-buckets:
    image: amazon/aws-cli:2.39.5
    container_name: lince-s3-buckets
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ROOT_USER:-lince}
      AWS_SECRET_ACCESS_KEY: ${S3_ROOT_PASSWORD:?defina S3_ROOT_PASSWORD em infra/.env}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://s3:9000
      S3_BUCKET: ${S3_BUCKET:-lince-clipes}
      TEST_S3_BUCKET: ${TEST_S3_BUCKET:-lince-clipes-teste}
    entrypoint: >
      /bin/sh -c "
      for b in $${S3_BUCKET} $${TEST_S3_BUCKET}; do
      aws s3api head-bucket --bucket $$b 2>/dev/null || aws s3 mb s3://$$b || exit 1;
      done
      "

volumes:
  pgdata:
  redisdata:
  s3data:
