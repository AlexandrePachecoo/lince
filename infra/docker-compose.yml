# Infraestrutura de DESENVOLVIMENTO do control plane (nuvem).
#
# Este arquivo NÃO é o compose do box da loja. O box (agente + redis local +
# tailscale + watchtower, §3.8 da arquitetura) mora em arquivo próprio e sobe
# em hardware com GPU — misturar os dois confunde dois ambientes que têm
# requisitos e ciclos de vida diferentes.
#
# Uso:  pnpm infra:up   (ou  docker compose -f infra/docker-compose.yml up -d)
#
# O Redis daqui também é o alvo dos testes marcados com `redis` do agente
# (`uv run pytest -m redis`), que usam o banco 15 e prefixo próprio por teste. Não é
# o Redis do box — é o mesmo software cumprindo dois papéis em desenvolvimento.
#
# O MinIO faz o papel do Cloudflare R2 (§4.4) em desenvolvimento: é a mesma API S3,
# então a URL pré-assinada que a API emite e o `PUT` que o agente faz nela são o
# mesmo código dos dois lados — o que muda é só o endpoint. Vale a pena rodar um
# container a mais por isso: o caminho do clipe é onde moram as armadilhas já pagas
# do agente (`Content-Length` obrigatório, corpo reaberto a cada tentativa), e
# nenhuma delas aparece se o teste só conferir o formato da URL assinada.

name: lince-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: lince-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lince}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-lince}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lince} -d ${POSTGRES_DB:-lince}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: lince-redis
    restart: unless-stopped
    # appendonly: BullMQ perde jobs enfileirados se o Redis reiniciar sem AOF.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Papel do Cloudflare R2 (§4.4) em desenvolvimento. Path-style (`/bucket/chave`) é
  # o que o MinIO fala e o que o R2 também aceita, então o mesmo assinador serve aos
  # dois sem um caso especial por ambiente.
  #
  # A imagem não é mais a `minio/minio` do Docker Hub: a MinIO parou de publicar imagem
  # da edição comunitária em outubro de 2025, o repositório sumiu do Docker Hub (`pull
  # access denied`) e o espelho `quay.io/minio/minio` passou a exigir login. A que fica
  # é a reconstrução da Chainguard a partir do fonte — o mesmo servidor, sem a CVE-2025-
  # 62506 que a última imagem oficial (2025-09-07) carrega.
  #
  # Fixada por digest, e não por `latest`: o plano gratuito da Chainguard só publica
  # `latest`, que muda quase todo dia, e `latest` foi exatamente o que deixou o CI
  # vermelho de um dia para o outro. Para atualizar, troque o digest pelo do índice
  # multi-arquitetura atual (`docker buildx imagetools inspect cgr.dev/chainguard/minio:latest`).
  #
  # Roda como `nonroot` (uid 65532), não como root. Volume criado pela imagem antiga
  # tem arquivos de root e o servidor não sobe sobre ele: apague o volume
  # (`docker volume rm lince-dev_miniodata`) — é ambiente de desenvolvimento, e o
  # `minio-buckets` recria os buckets na subida seguinte.
  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:cee9a8e35885e93f14b3cb32960e5017aff74e2adfb52ba87c65003b0163886b
    container_name: lince-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lince}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD em infra/.env}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Cria os buckets e sai. Sem isto, a primeira emissão de URL pré-assinada assina
  # perfeitamente contra um bucket que não existe e o `PUT` do agente leva 404 — um
  # erro que se parece com bug de assinatura e não é.
  #
  # Dois buckets pelo mesmo motivo do schema `lince_test` do Postgres: a suíte da API
  # apaga o que cria, e apagar por engano os clipes que o dev estava olhando na mão
  # seria um jeito bobo de perder uma tarde.
  #
  # Mesma origem e mesma regra de digest da imagem do servidor, pelo mesmo motivo
  # (`minio/mc` também sumiu do Docker Hub). Esta imagem **não tem `sh`**, só
  # `/usr/bin/bash` (com `/bin` apontando para `/usr/bin`): é por isso que o
  # `entrypoint` chama `bash`, e um `sh` aqui falha na criação do container com
  # `stat /bin/sh: no such file or directory`.
  minio-buckets:
    image: cgr.dev/chainguard/minio-client:latest@sha256:ac75abc3947742b7d5d11e145eb0759c5b59ae697956fda325e91f6fd742b005
    container_name: lince-minio-buckets
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lince}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD em infra/.env}
      S3_BUCKET: ${S3_BUCKET:-lince-clipes}
      TEST_S3_BUCKET: ${TEST_S3_BUCKET:-lince-clipes-teste}
    entrypoint: >
      /bin/bash -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc mb --ignore-existing local/$${TEST_S3_BUCKET}
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
