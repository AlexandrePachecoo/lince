# O que o CLAUDE.md exige antes de dar qualquer coisa por concluída, agora exigido
# também de quem esquecer de rodar. Um job por ecossistema, com ciclos de vida
# próprios — a borda em Python não deve esperar o Postgres subir para saber que um
# teste de tracking quebrou, e o dashboard não espera infra nenhuma.
#
# O que este CI deliberadamente NÃO roda: os testes marcados (`rtsp`, `redis`,
# `modelo`). O `-m modelo` exige o .onnx que o scripts/modelo.sh baixa e que não vai
# para o git; o `-m rtsp` exige as câmeras sintéticas. Ambos cabem num job próprio no
# dia em que houver motivo — o padrão é o que o CLAUDE.md manda rodar numa máquina
# limpa, e é ele que precisa continuar verdadeiro.

name: CI

on:
  push:
    branches: ["**"]
    # A tag `agente-vX.Y.Z` é o que publica a imagem `X.Y.Z` do agente (job `publica`).
    # Ela passa pelo CI inteiro antes: imagem de loja não sai de commit vermelho.
    tags: ["agente-v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agente:
    name: agente (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4

      # ffmpeg não é dependência opcional do agente: o estágio 1 decodifica com ele e
      # o estágio 5 corta o clipe com ele. O CLAUDE.md proíbe mockar o que roda no
      # ambiente, então sem ffmpeg instalado ~12 testes de ingestão viram erro.
      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      # Instalador oficial em vez de uma action de terceiro: uma dependência a menos
      # para manter atualizada, e o mesmo caminho que o scripts/setup.sh usa.
      - name: uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: dependências
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check src tests

      - name: ruff format
        run: uv run ruff format --check src tests

      - name: pytest
        run: uv run pytest

  api:
    name: api (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # `packageManager` no package.json da raiz é quem fixa a versão do pnpm; o
      # corepack só obedece. Repetir o número aqui criaria duas fontes divergentes.
      - name: pnpm
        run: corepack enable

      # A infra de teste é o MESMO docker-compose que o dev sobe com `pnpm infra:up`.
      # Declarar `services:` no workflow duplicaria a definição do ambiente, e a cópia
      # do CI é a que ninguém percebe que ficou para trás.
      - name: infra (Postgres + MinIO)
        working-directory: .
        env:
          SENHA_CI: senha-de-ci-nao-secreta
        run: |
          sed "s/troque-esta-senha/$SENHA_CI/g" infra/.env.example > infra/.env
          docker compose -f infra/docker-compose.yml up -d --wait postgres redis minio
          # Serviço de uma tacada só: cria os buckets e sai. Em primeiro plano, porque
          # o que interessa é ele ter terminado antes do primeiro teste — URL assinada
          # contra bucket inexistente é 404 no PUT, e parece erro de credencial.
          docker compose -f infra/docker-compose.yml up minio-buckets

      - name: .env da API
        env:
          SENHA_CI: senha-de-ci-nao-secreta
        run: sed "s/troque-esta-senha/$SENHA_CI/g" .env.example > .env

      - name: dependências
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: prisma generate
        run: pnpm prisma:generate

      - name: migrations
        run: |
          set -a && . ./.env && set +a
          pnpm exec prisma migrate deploy
          # O schema lince_test é onde a suíte roda (TRUNCATE entre testes). Precisa
          # das mesmas migrations, e é criado pelo próprio migrate deploy.
          DATABASE_URL="$TEST_DATABASE_URL" pnpm exec prisma migrate deploy

      - name: biome
        run: pnpm lint

      - name: testes
        run: pnpm test

  dashboard:
    name: dashboard (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: pnpm
        run: corepack enable

      - name: dependências
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: biome
        run: pnpm lint

      # Sem Postgres nem MinIO: a rede é fingida na suíte do front, então este job não
      # espera infra nenhuma subir. O que ele guarda de verdade é o teste de contrato,
      # que valida as fixturas contra os schemas de packages/shared -- é ele que impede
      # os tipos escritos à mão em src/api/tipos.ts de divergirem da API em silêncio.
      - name: testes
        run: pnpm test

      # O build entra no CI porque `tsc -b` roda aqui e não no `pnpm test`: o Vitest
      # transpila sem checar tipos, então sem esta etapa um erro de tipo passaria verde.
      - name: build
        run: pnpm build

  # A imagem do box (§3.8). O que só se verifica com ela construída — e que, errado, não
  # dá erro na loja: degrada para CPU em silêncio (R-4, §10.10).
  #
  # O runner não tem GPU, e nada aqui precisa de uma. Conferir que o provider de CUDA
  # CARREGARIA é um `ldd`: se uma biblioteca do CUDA não resolve na imagem, o
  # `onnxruntime-gpu` cai para CPU na loja exatamente do mesmo jeito.
  imagem:
    name: imagem do agente (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # O compose do box com o .env de exemplo, e com o override de desenvolvimento. É o
      # que pega variável obrigatória sem valor, chave com erro de digitação e o
      # override deixando de casar com o arquivo base.
      - name: compose do box
        working-directory: infra/box
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q

      # A suíte do agente DENTRO da imagem: o ffmpeg do Ubuntu da imagem e o
      # `onnxruntime-gpu`, que é o pacote que vai para a loja — não o `onnxruntime` de
      # CPU que o job `agente` testa. O build falha se um teste falhar.
      - name: testes na imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agent/Dockerfile
          target: teste
          cache-from: type=gha,scope=agente
          cache-to: type=gha,scope=agente,mode=max

      - name: imagem do box
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agent/Dockerfile
          target: agente
          load: true
          tags: lince-agent:ci
          cache-from: type=gha,scope=agente

      # As quatro coisas que fazem o box usar a placa, uma por linha para o log dizer
      # qual quebrou:
      # - o ffmpeg da imagem tem NVDEC (`cuda` em `-hwaccels`);
      # - o ONNX Runtime instalado é o de GPU (o de CPU não lista o provider);
      # - toda biblioteca de que o provider de CUDA depende resolve na imagem — menos a
      #   `libcuda.so.1`, que é do driver e vem do host pelo NVIDIA Container Toolkit;
      # - o cuDNN 9, que o provider abre por `dlopen` e por isso não aparece no `ldd`.
      - name: a imagem tem o que a GPU precisa
        run: |
          docker run --rm --entrypoint sh lince-agent:ci -euc '
            lince-agent --help > /dev/null
            ffmpeg -hide_banner -hwaccels | grep -qx cuda
            python -c "import onnxruntime as o; p = o.get_available_providers(); assert \"CUDAExecutionProvider\" in p, p"
            so=$(python -c "import onnxruntime, pathlib; print(pathlib.Path(onnxruntime.__file__).parent / \"capi\" / \"libonnxruntime_providers_cuda.so\")")
            faltando=$(ldd "$so" | grep "not found" | grep -v "libcuda.so.1" || true)
            if [ -n "$faltando" ]; then echo "provider de CUDA não carregaria:"; echo "$faltando"; exit 1; fi
            ldconfig -p | grep -q "libcudnn.so.9"
            echo "$NVIDIA_DRIVER_CAPABILITIES" | tr , "\n" | grep -qx video
          '

  # Publica a imagem que os boxes puxam (infra/box/docker-compose.yml). Só depois dos
  # testes do agente e da imagem, e só em dois casos:
  # - push na main → `main` e `sha-<commit>`, para a máquina de desenvolvimento e para
  #   uma loja piloto que alguém queira apontar para um commit exato;
  # - tag `agente-vX.Y.Z` → `X.Y.Z`, que é o que o `LINCE_VERSAO` de uma loja usa.
  # Nunca `latest` (R-7): cada loja diz no `.env` a versão que roda.
  publica:
    name: publica a imagem do agente
    needs: [agente, imagem]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/agente-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # O nome da imagem em minúsculas e escrito aqui, igual ao padrão do compose do
      # box: o registry recusa maiúsculas, e o dono do repositório tem.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alexandrepachecoo/lince-agent
          flavor: latest=false
          tags: |
            type=match,pattern=agente-v(\d+\.\d+\.\d+),group=1
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agent/Dockerfile
          target: agente
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agente
